<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<html lang="ko">
<link href="css/style_search.css" rel="stylesheet" type="text/css">
<link href="css/style_stages.css" rel="stylesheet" type="text/css">
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input { width: 300px; padding: 8px; margin-bottom: 20px; }
    .document { margin-bottom: 15px; }
    .document a { font-weight: bold; color: blue; text-decoration: none; }
    .document a:hover { text-decoration: underline; }
  </style>
<title>의약품GMP동향</title>
</head>

<body>
  <div class="search">
    <h2>의약품 GMP 가이드라인 동향</h2>
  </div>

  <input type="text" id="searchBox" placeholder="제목을 입력하세요...">

  <div id="results"></div>

  <script>
    let documents = [];

    const searchBox = document.getElementById('searchBox');
    const results = document.getElementById('results');

    // 문서 목록 렌더링
    function renderResults(query) {
      results.innerHTML = '';
      }
      const filtered = documents.filter(doc =>
        doc.title.toLowerCase().includes(query.toLowerCase())
      );

      if (filtered.length === 0) {
        results.innerHTML = '<p>검색 결과가 없습니다.</p>';
        return;
      }

      filtered.forEach(doc => {
        const div = document.createElement('div');
        div.className = 'document';
        div.innerHTML = `
          <a href="${doc.link}" target="_blank">${doc.title}</a><br>
          <small>${doc.country} | ${doc.date}</small>
        `;
        results.appendChild(div);
      });
    }

    // 검색 이벤트 리스너
    searchBox.addEventListener('input', () => {
      renderResults(searchBox.value);
    });

    // 외부 JSON 불러오기
    fetch('documents.json')
      .then(response => response.json())
      .then(data => {
        documents = data;
        renderResults(''); // 초기 전체 목록 표시
      })
      .catch(error => {
        console.error('문서 데이터를 불러오는 중 오류 발생:', error);
        results.innerHTML = '<p>문서 데이터를 불러올 수 없습니다.</p>';
      });
  </script>

  <div class="contents">
    <div id="stages">
      <h3>주기 단계</h3>
      <p>0.GMP가이던스</br>
      1.GMP일반</br>
      2.GMP시설설비</br>
      3.품질관리</br>
      4.밸리데이션</br>
      5.GMP실사</br>
      6.기타</p>
      <div id=view_btn>
        <button class="btn1" onclick="location.href='index1.html'">보기</button>
      </div>
    </div>
    <div id="stages">
      <h3>가이드라인 종류</h3>
      <p>MFDS- 한국</br>
      FDA- 미국</br>
      EMA- 유럽</br>
      PIC/S</br>
      ICH<br>
      WHO- 세계보건 기구</br>
      PMDA-일본</p>
      <div id=view_btn>
        <button class="btn1" onclick="location.href='index2.html'">보기</button>
      </div>
    </div>
  </div>
</body>
</html>
