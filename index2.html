<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="css/style_header.css" rel="stylesheet" type="text/css">
<link href="css/style1.css" rel="stylesheet" type="text/css">
<title>의약품GMP동향</title>
</head>
  
<body>
<!-- Header: 메뉴 -->
<div id="header">
	<h2>의약품 GMP 가이드라인 동향</h2>
	<br>
	<h2 id="title"></h2>
  	<div id="pdf-list"></div>
	  <script>
	    const params = new URLSearchParams(window.location.search);
	    const submenuId = params.get("submenu");
	
	    fetch("../documents.json")
	      .then(res => res.json())
	      .then(data => {
	        let found = null;
	        data.forEach(menu => {
	          menu.submenus.forEach(sub => {
	            if (sub.id === submenuId) found = sub;
	          });
	        });
	
	        if (found) {
	          document.getElementById("title").textContent = found.name;
	          const container = document.getElementById("pdf-list");
	
	          found.pdfs.forEach(pdf => {
	            const h3 = document.createElement("h3");
	            h3.textContent = pdf.title;
	            const iframe = document.createElement("iframe");
	            iframe.src = "../pdf/" + pdf.file;
	            container.appendChild(h3);
	            container.appendChild(iframe);
	          });
	        } else {
	          document.getElementById("title").textContent = "PDF 정보를 찾을 수 없습니다.";
	        }
	      });
	  </script>
</div>
</body>
